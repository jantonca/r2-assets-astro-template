# Wrangler config for Pattern B: Single worker (site + assets)
# Use this when your site is static (no SSR adapter)
# Copy to project root as wrangler.toml

name = "my-project"
main = "workers/worker-single.js"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

# Custom domains
routes = [
  { pattern = "cdn.yourproject.com", custom_domain = true },
  { pattern = "yourproject.com", custom_domain = true },
  { pattern = "www.yourproject.com", custom_domain = true }
]

# Static site assets (Astro build output)
[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/images/*", "/fonts/*", "/documents/*"]

# R2 bucket binding
[[r2_buckets]]
binding = "IMAGES_BUCKET"
bucket_name = "your-bucket-name"
